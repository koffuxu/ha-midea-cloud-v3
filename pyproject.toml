[project]
name = "ha-midea-cloud-v3"
version = "0.1.0"
description = "Home Assistant custom integration for Midea IoT Cloud-to-Cloud V3 API"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
