name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install aiohttp pytest pytest-asyncio ruff
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest -v
